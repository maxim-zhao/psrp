# ********************
# *** Introduction ***
# ********************

- offsets: 45ef
  # Game intro
  # Nero on ground, robot police
  pt-pt: |
    Cidadãos de Camineet, que este moribundo sirva de exemplo para todos vós.<line><line>
    Desafiar o Lorde LaShiec não será tolerado!<wait more>
    Nero? NERO!<line><line>
    O que aconteceu?!<wait>

- offsets: 45fa
  # Game intro
  # Nero, dying
  pt-pt: |
    Alisa, minha irmã.<line><line>
    Ouve com atenção, não tenho muito tempo.<wait more>
    Os rumores que ouvimos são verdadeiros. LaShiec... mudou.<line>
    E isso vai além de os seus militares tomarem conta das nossas ruas.<wait more>
    Todas essas criaturas horríveis lá fora, todas essas trevas entre nós...<line><line>
    De alguma forma, todas as evidências apontam para ele.<wait more>
    Tentei descobrir, mas acho que cheguei bem perto da verdade.<line><line>
    Só resta uma opção agora, para todos nós.<wait more>
    O Lorde LaShiec deve ser detido.<line><line>
    Se não for, as trevas com as quais ele se alinhou tomarão toda Algol.<wait more>
    O meu erro foi tentar apanhá-lo sozinho.<line><line>
    Estas pessoas são perigosas, vais precisar de ajuda.<wait more>
    Ouvi histórias de um guerreiro chamado Tylon, que poderia ser um aliado.<line><line>
    Queria contar com a tua ajuda, mas ele está desaparecido.<wait more>
    Alisa, precisas de encontrar Tylon.<line><line>
    Juntos podem derrotar LaShiec e devolver a paz a Algol.<wait more>
    Alisa... um fardo tão terrível. Peço desculpa.<line><line>
    Por favor, perdoa-me por te pedir isto...<wait more>
    ...e por te deixar...<line><line>
    ...sozinha...<wait>

- offsets: 4605
  # Game intro
  # Alisa
  pt-pt: |
    Nero...<wait more>
    A tua morte não será em vão, eu juro.<line><line>
    Não deixarei que estes monstros invadam a nossa casa.<wait more>
    Vigia e protege-me, meu irmão.<line><line>
    Com o teu espírito ao meu lado, LaShiec não terá a mínima hipótese.<wait>

